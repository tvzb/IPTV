name: 1-全网直播源采集与清洗 (Harvest)

on:
  workflow_dispatch:
    inputs:
      remarks:
        description: '采集备注信息（选填）'
        required: false
        default: 'Manual Harvest Triggered'

permissions:
  contents: write

jobs:
  harvest-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装与配置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行全网大采集与标准化清洗 (Run Harvester)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u harvester.py

      - name: 提交并推流更新 raw_sources.txt (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_sources.txt
          if git diff --staged --quiet; then
            echo "全量候选源无变更，跳过提交。"
          else
            git commit -m "chore(iptv): update raw_sources.txt [skip ci]"
            git push
          fi
