name: IPTV 五步法自动采集与测速更新

on:
  workflow_dispatch:
    inputs:
      min_speed:
        description: '最低测速门槛 (KB/s)，默认 200'
        required: false
        default: '200'
      custom_channels_json:
        description: '网页端设置的分类与频道列表 JSON (若为空则采用 config.py 官方定义)'
        required: false
        default: ''

  push:
    branches:
      - main
      - master
    paths:
      - 'main.py'
      - 'config.py'
      - 'channels.json'
      - '.github/workflows/main.yml'

concurrency:
  group: iptv-five-step-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest-and-speedtest:
    name: 首页20条全量提取 -> 清洗去重 -> 初次测速 -> 央卫视后缀智能裂变 -> 新增源二次测速排序
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装 FFmpeg 与 Python 依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests urllib3
          fi

      - name: 4. 执行 IPTV 五步工作流核心脚本
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          CUSTOM_CHANNELS_JSON: ${{ inputs.custom_channels_json }}
        run: |
          SPEED_LIMIT="${{ inputs.min_speed }}"
          if [ -z "$SPEED_LIMIT" ]; then
            SPEED_LIMIT="200"
          fi
          echo "当前设定最低测速门槛: ${SPEED_LIMIT} KB/s"
          if [ -n "$CUSTOM_CHANNELS_JSON" ]; then
            echo "$CUSTOM_CHANNELS_JSON" > channels.json
            echo "已接收网页端提交的自定义频道 JSON 并保存至 channels.json"
          else
            echo "本次为手动点击 Run workflow 或定时任务，将采用 config.py 官方定义与排序"
          fi
          python main.py "${SPEED_LIMIT}"

      - name: 5. 校验并自动提交最新直播源至仓库
        run: |
          if [ ! -s "live.txt" ]; then
            echo "错误：生成的 live.txt 为空或不存在，终止提交！"
            exit 1
          fi
          LINE_COUNT=$(wc -l < live.txt)
          STREAM_COUNT=$(grep -E "^[^#].*,http" live.txt | grep -v "^最新更新:" | wc -l || true)
          echo "生成校验通过：live.txt 共 ${LINE_COUNT} 行，包含有效高清直播源 ${STREAM_COUNT} 条。"
          if [ "$STREAM_COUNT" -lt 5 ]; then
            echo "警告：本次有效源数量过少 (<5条)，跳过覆盖提交以保留上一版可用源！"
            exit 0
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.txt live.m3u raw_sources.txt raw_sources.m3u channels.json 2>/dev/null || git add live.txt live.m3u

          if git diff --staged --quiet; then
            echo "直播源列表与上一版本完全一致，无需重复提交。"
          else
            NOW_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "chore(live): 自动更新高清直播源(20条全量提取+后缀裂变,1080P优先) [${NOW_TIME}]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
            echo "最新 TVBox 直播源已成功推送到仓库！"
          fi
