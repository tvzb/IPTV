name: IPTV 五步法自动采集与测速更新

on:
  workflow_dispatch:
    inputs:
      search_pages:
        description: '采集搜索结果页数 (默认1即首页；选2采集第1、2页；依此类推)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      enable_logo_ocr:
        description: '开启测速视频画面左上角台标识别与频道名称自动纠错'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  push:
    branches:
      - main
      - master
    paths:
      - 'main.py'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/main.yml'

concurrency:
  group: iptv-five-step-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest-and-speedtest:
    name: 多页提取 -> 清洗去重 -> 分辨率动态测速与台标纠错 -> 智能裂变 -> 四档流畅排序
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装 FFmpeg 与 Python 依赖 (含 RapidOCR 左上角台标识别库)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests urllib3 opencv-python-headless numpy rapidocr-onnxruntime
          fi

      - name: 4. 执行 IPTV 五步工作流核心脚本
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          SEARCH_PAGES: ${{ inputs.search_pages || '1' }}
          ENABLE_LOGO_OCR: ${{ inputs.enable_logo_ocr || 'true' }}
        run: |
          PAGES_COUNT="${{ inputs.search_pages }}"
          if [ -z "$PAGES_COUNT" ]; then
            PAGES_COUNT="1"
          fi
          echo "当前设定采集搜索结果页数: 前 ${PAGES_COUNT} 页"
          echo "当前左上角台标 OCR 自动纠错开关: ${ENABLE_LOGO_OCR}"
          echo "直接采用 config.py 官方频道列表与分辨率动态速度标准运行..."
          python main.py "${PAGES_COUNT}"

      - name: 5. 校验并自动提交最新直播源至仓库
        run: |
          if [ ! -s "live.txt" ]; then
            echo "错误：生成的 live.txt 为空或不存在，终止提交！"
            exit 1
          fi
          LINE_COUNT=$(wc -l < live.txt)
          STREAM_COUNT=$(grep -E "^[^#].*,http" live.txt | wc -l || true)
          echo "生成校验通过：live.txt 共 ${LINE_COUNT} 行，包含有效直播源记录 ${STREAM_COUNT} 条。"
          if [ "$STREAM_COUNT" -lt 5 ]; then
            echo "警告：本次有效源数量过少 (<5条)，跳过覆盖提交以保留上一版可用源！"
            exit 0
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.txt live.m3u raw_sources.txt raw_sources.m3u 2>/dev/null || git add live.txt live.m3u

          if git diff --staged --quiet; then
            echo "直播源列表与上一版本完全一致，无需重复提交。"
          else
            NOW_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "chore(live): 自动更新直播源(前${{ inputs.search_pages || '1' }}页采集+分辨率动态测速+台标纠错) [${NOW_TIME}]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
            echo "最新 TVBox 直播源已成功推送到仓库！"
          fi
