name: IPTV 五步法自动采集与测速更新

on:
  workflow_dispatch:
    inputs:
      min_speed:
        description: '最低测速门槛 (KB/s)，默认 150'
        required: false
        default: '150'
      custom_channels_json:
        description: '网页端设置的分类与频道列表 JSON (可选)'
        required: false
        default: ''

  push:
    branches:
      - main
      - master
    paths:
      - 'main.py'
      - 'config.py'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest-and-speedtest:
    name: 首页精准搜索(跳过无预览) -> 清洗 -> 初测 -> 央卫视裂变 -> 清晰度优先(1080P>576P)排序
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 1. 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 2. 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🛠️ 3. 安装 FFmpeg 与依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests urllib3
          fi

      - name: 🚀 4. 执行 IPTV 五步工作流核心脚本
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          CUSTOM_CHANNELS_JSON: ${{ github.event.inputs.custom_channels_json }}
        run: |
          SPEED_LIMIT="${{ github.event.inputs.min_speed || '200' }}"
          echo "当前设定最低测速门槛: ${SPEED_LIMIT} KB/s"
          # 只有在网页端明确传入了自定义 JSON 时，才保存到 channels.json
          if [ -n "$CUSTOM_CHANNELS_JSON" ]; then
            echo "$CUSTOM_CHANNELS_JSON" > channels.json
            echo "✅ 已同步保存网页端提交的自定义频道分类列表至 channels.json"
          fi
          python main.py "${SPEED_LIMIT}"

      - name: 🔍 5. 校验输出文件完整性 (防空文件保护)
        id: verify_output
        run: |
          if [ ! -s "live.txt" ]; then
            echo "❌ 错误：生成的 live.txt 为空或不存在，终止提交！"
            exit 1
          fi
          LINE_COUNT=$(wc -l < live.txt)
          STREAM_COUNT=$(grep -E "^[^#].*,http" live.txt | wc -l || true)
          echo "✅ 生成校验通过：live.txt 共 ${LINE_COUNT} 行，包含有效高速直播源 ${STREAM_COUNT} 条。"
          if [ "$STREAM_COUNT" -lt 10 ]; then
            echo "⚠️ 警告：本次有效源数量过少 (<10条)，跳过覆盖提交！"
            echo "should_commit=false" >> $GITHUB_OUTPUT
          else
            echo "should_commit=true" >> $GITHUB_OUTPUT
          fi

      - name: 📤 6. 自动提交并推送最新直播源至仓库
        if: steps.verify_output.outputs.should_commit == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 加上 --autostash 参数，完美避免拉取冲突
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add live.txt live.m3u raw_sources.txt raw_sources.m3u channels.json 2>/dev/null || git add live.txt live.m3u

          if git diff --staged --quiet; then
            echo "ℹ️ 直播源列表与上一版本完全一致，无需重复提交。"
          else
            NOW_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "chore(live): 自动更新央视与卫视高清直播源(1920x1080优先排序) [${NOW_TIME}]"
            git push origin HEAD:${{ github.ref_name }}
            echo "🎉 最新 TVBox 直播源已成功推送到仓库！"
          fi
