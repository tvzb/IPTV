name: IPTV 主采集与标准订阅更新
on:
  workflow_dispatch:
    inputs:
      search_pages: {description: 'GitHub 搜索页数', required: false, default: '3', type: choice, options: ['1','2','3','4','5']}
      recent_days: {description: '最近提交天数', required: false, default: '30', type: choice, options: ['14','30','45','60']}
      enable_logo_ocr: {description: '启用台标 OCR', required: false, default: 'true', type: choice, options: ['true','false']}
  schedule:
    - cron: '20 7 1,16 * *'
  push:
    branches: [main, master]
    paths: ['main.py','config.py','requirements.txt','scripts/**','.github/workflows/main.yml']
concurrency:
  group: 'iptv-main-${{ github.ref }}'
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      RECENT_DAYS: ${{ inputs.recent_days || '30' }}
      MAX_RECENT_REPOS: '60'
      ENABLE_LOGO_OCR: ${{ inputs.enable_logo_ocr || 'true' }}
      SEARCH_PAGES: ${{ inputs.search_pages || '3' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run original five-step collector
        env: {GITHUB_TOKEN: '${{ secrets.PAT_TOKEN || github.token }}'}
        run: python main.py "${SEARCH_PAGES}"
      - name: Build catalogue and free playlist
        if: success()
        run: python scripts/build_catalog.py
      - name: Validate outputs
        if: success()
        run: |
          test -s channels.json
          test -s test.txt
          COUNT=$(grep -Ec '^[^#].*,https?://' live.txt || true)
          echo "Valid playlist rows: $COUNT"
          if [ "$COUNT" -lt 5 ]; then echo 'Too few streams; refusing publish'; exit 1; fi
      - name: Upload outputs to Cloudflare R2
        if: success()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then echo 'Missing R2 credentials; cannot publish production playlists'; exit 1; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          pip install awscli
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp live.txt "s3://${R2_BUCKET}/public/live.txt" --endpoint-url "$ENDPOINT" --content-type 'text/plain; charset=utf-8'
          aws s3 cp test.txt "s3://${R2_BUCKET}/public/test.txt" --endpoint-url "$ENDPOINT" --content-type 'text/plain; charset=utf-8'
          aws s3 cp channels.json "s3://${R2_BUCKET}/internal/channels.json" --endpoint-url "$ENDPOINT" --content-type 'application/json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iptv-main-${{ github.run_number }}
          retention-days: 14
          path: |
            live.txt
            live.m3u
            raw_live.txt
            test.txt
            channels.json
            workflow_error.txt
