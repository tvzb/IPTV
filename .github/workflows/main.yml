name: IPTV 自动采集与联通宽带优选

on:
  workflow_dispatch:
    inputs:
      search_pages:
        description: "GitHub 搜索采集页数（默认采集前 2 页）"
        required: false
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      search_month:
        description: "GitHub 搜索更新月份标记"
        required: false
        default: "2026-10"
        type: string
      enable_logo_ocr:
        description: "启用视频台标 OCR 精准纠错"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main, master]
    paths:
      - "main.py"
      - "config.py"
      - "requirements.txt"
      - "tvbox_probe.py"
      - ".github/workflows/main.yml"

concurrency:
  group: iptv-harvest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      SEARCH_MONTH: ${{ inputs.search_month || '2026-10' }}
      ENABLE_LOGO_OCR: ${{ inputs.enable_logo_ocr || 'true' }}
      SEARCH_PAGES: ${{ inputs.search_pages || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPTV collector
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          python main.py "${SEARCH_PAGES}"

      - name: Ensure output files exist
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          date = datetime.datetime.now().strftime('%Y-%m-%d')
          if not Path('live.txt').exists():
              Path('live.txt').write_text('央视频道,#genre#\n卫视频道,#genre#\n电视频道,#genre#\n更新时间,#genre#\n' + date + ',#genre#\n频道定制,#genre#\n微信：bofutz,#genre#\n', encoding='utf-8')
          if not Path('live.m3u').exists():
              Path('live.m3u').write_text('#EXTM3U\n', encoding='utf-8')
          if not Path('raw_live.txt').exists():
              Path('raw_live.txt').write_text('', encoding='utf-8')
          print('raw_live.txt bytes:', Path('raw_live.txt').stat().st_size)
          print('live.txt bytes:', Path('live.txt').stat().st_size)
          print('live.m3u bytes:', Path('live.m3u').stat().st_size)
          PY

      - name: Upload result files (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-results-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            live.txt
            live.m3u
            raw_live.txt
            raw_sources.txt
            raw_sources.m3u
            workflow_error.txt

      - name: Validate and commit playlist
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STREAM_COUNT=$(grep -E '^[^#].*,https?://' live.txt | wc -l || true)
          echo "最终 TXT 直播源记录：${STREAM_COUNT}"
          if [ "${STREAM_COUNT}" -lt 5 ]; then
            echo "本轮不足5条有效源：保留仓库原有订阅，不覆盖线上稳定版本。结果仍可从 Actions Artifacts 下载。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f live.txt live.m3u
          [ ! -f raw_live.txt ] || git add -f raw_live.txt
          [ ! -f raw_sources.txt ] || git add -f raw_sources.txt
          [ ! -f raw_sources.m3u ] || git add -f raw_sources.m3u
          if git diff --cached --quiet; then
            echo "订阅内容无变化，无需提交。"
          else
            git commit -m "chore(iptv): refresh playlists $(date '+%Y-%m-%d %H:%M')"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
