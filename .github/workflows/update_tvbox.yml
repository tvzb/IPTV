name: 自动抓包更新点播源

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'ikanbot 影片播放页链接'
        required: false
        default: 'https://www1.ikanbot.com/play/995772'
        
jobs:
  crawl-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Crawler
        run: |
          python crawl_ikanbot.py

      - name: Run Validator and Deduplicate
        run: |
          python check_and_update.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tv.txt
          if git diff --staged --quiet; then
            echo "无配置变动"
          else
            git commit -m "Auto: 自动嗅探 ikanbot 线路并更新 tv.txt"
            git push
          fi
