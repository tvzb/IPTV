name: 电视直播源采集与测速工作流 (IPTV Pipeline)

on:
  schedule:
    # 每天 UTC 04:00 与 16:00 (北京时间 12:00 与 00:00) 自动全流程更新
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '执行模式：full (全流程：采集+裂变+测速) / harvest (仅采集与裂变) / speedtest (仅TVBox测速)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - harvest
          - speedtest
      min_speed_kbs:
        description: '最低流畅播放速率门槛 (KB/s，达标不限数量，越多越好)'
        required: true
        default: '150'

permissions:
  contents: write

jobs:
  iptv-pipeline-job:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境 (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行工作流核心引擎
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py "${{ inputs.mode || 'full' }}" "${{ inputs.min_speed_kbs || '300' }}"

      - name: 提交并推送最新文件 (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt live.m3u raw_sources.txt raw_sources.m3u
          if git diff --staged --quiet; then
            echo "文件无变更，跳过提交。"
          else
            git commit -m "chore(iptv): automated stream update [skip ci]"
            git push
          fi
