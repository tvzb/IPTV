name = "iptv-platform-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "iptv-db"
database_id = "123a6c91-5e6d-4cd7-9acf-d4c88a6ea9b4"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_R2_BUCKET"

[vars]
SITE_NAME = "IPTV 直播源中心"
PUBLIC_BASE_URL = "https://YOUR_DOMAIN"
GITHUB_OWNER = "YOUR_GITHUB_OWNER"
GITHUB_REPO = "YOUR_REPOSITORY"
GITHUB_CUSTOM_WORKFLOW = "custom.yml"
